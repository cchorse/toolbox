<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolbox - 極簡數位工具箱</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#faf5ff',
                            100: '#f3e8ff',
                            200: '#e9d5ff',
                            300: '#d8b4fe',
                            400: '#c084fc',
                            500: '#a855f7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .glass-header { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 border-b border-slate-200/80 dark:border-slate-800/80 glass-header">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 flex-shrink-0">
                <div class="w-9 h-9 rounded-xl bg-purple-500/10 dark:bg-purple-400/20 text-purple-500 dark:text-purple-300 flex items-center justify-center">
                    <i class="fa-solid fa-toolbox text-base"></i>
                </div>
                <span class="font-bold text-base tracking-tight text-slate-900 dark:text-white">Toolbox</span>
            </div>

            <!-- Centered Search Bar -->
            <div class="flex-1 max-w-md relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="searchInput" placeholder="搜尋工具名稱或關鍵字..." 
                    class="w-full pl-9 pr-8 py-1.5 text-xs bg-slate-100 dark:bg-slate-800/60 border border-transparent dark:border-slate-700/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-400 focus:bg-white dark:focus:bg-slate-900 transition-all">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Right Action Buttons -->
            <div class="flex items-center space-x-2 flex-shrink-0">
                <button onclick="openAddModal()" title="新增工具" class="px-3 py-1.5 text-xs font-medium bg-purple-500 hover:bg-purple-600 active:scale-95 text-white rounded-xl transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-plus text-[10px]"></i>
                    <span class="hidden sm:inline">新增</span>
                </button>

                <button id="themeToggle" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-all text-xs" title="切換主題">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">
        
        <!-- Clean Horizontal Category Pills -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-1" id="categoryNav">
            <!-- Rendered dynamically by JS -->
        </div>

        <!-- Tool Cards Grid Section -->
        <section class="flex-1 min-w-0">
            <!-- Stats & Filter Bar -->
            <div class="flex items-center justify-between mb-4">
                <span id="currentCategoryTitle" class="text-xs font-semibold text-slate-500 dark:text-slate-400">全部工具</span>
                <span id="toolCountBadge" class="text-xs font-medium text-slate-400">0 個工具</span>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-2xl">
                <i class="fa-solid fa-magnifying-glass text-slate-300 dark:text-slate-700 text-3xl mb-3"></i>
                <p class="text-xs font-medium text-slate-500 dark:text-slate-400">未有找到相符的工具</p>
            </div>

            <!-- Cards Grid -->
            <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Cards rendered dynamically via JS -->
            </div>
        </section>

    </main>

    <!-- Modal: Add New Tool -->
    <div id="addModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl max-w-sm w-full mx-4 p-5 relative transform transition-transform scale-95" id="modalContainer">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-plus text-purple-500"></i> 新增工具連結
                </h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="addToolForm" onsubmit="handleAddTool(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">工具名稱 *</label>
                    <input type="text" id="toolTitle" required placeholder="例如: GitHub" class="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">網址 (URL) *</label>
                    <input type="url" id="toolUrl" required placeholder="https://..." class="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">分類 *</label>
                    <select id="toolCategory" required class="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">
                        <option value="dev">💻 開發</option>
                        <option value="ai">🤖 AI 助手</option>
                        <option value="design">🎨 設計</option>
                        <option value="utility">⚙️ 小工具</option>
                        <option value="doc">📝 筆記文檔</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">簡短描述</label>
                    <input type="text" id="toolDesc" placeholder="一句話介紹功能..." class="w-full px-3 py-1.5 text-xs bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-400">
                </div>

                <div class="pt-2 flex items-center justify-end space-x-2">
                    <button type="button" onclick="closeAddModal()" class="px-3 py-1.5 text-xs text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                        取消
                    </button>
                    <button type="submit" class="px-3.5 py-1.5 text-xs font-semibold bg-purple-500 hover:bg-purple-600 text-white rounded-lg shadow-sm transition-all">
                        儲存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-3.5 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center space-x-2 transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600 text-xs"></i>
        <span id="toastMsg">成功新增！</span>
    </div>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200/60 dark:border-slate-800/60 bg-white/40 dark:bg-slate-900/40 py-4 text-center text-[11px] text-slate-400">
        <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>© 2026 Toolbox Portal</p>
            <div class="flex items-center space-x-3">
                <button onclick="exportData()" class="hover:text-slate-600 dark:hover:text-slate-200 transition-colors">導出 JSON</button>
                <span>•</span>
                <button onclick="resetDefaults()" class="hover:text-rose-500 transition-colors">重置為預設</button>
            </div>
        </div>
    </footer>

    <script>
        // Sample Curated Tools Dataset
        const defaultTools = [
            { id: '1', title: 'GitHub', url: 'https://github.com', category: 'dev', desc: '程式碼託管與版本控制平台。', icon: 'fa-brands fa-github' },
            { id: '2', title: 'ChatGPT', url: 'https://chatgpt.com', category: 'ai', desc: 'OpenAI 寫作與寫程式 AI 助手。', icon: 'fa-solid fa-robot' },
            { id: '3', title: 'Claude AI', url: 'https://claude.ai', category: 'ai', desc: '高邏輯與長文本語境分析 AI 模型。', icon: 'fa-solid fa-brain' },
            { id: '4', title: 'Excalidraw', url: 'https://excalidraw.com', category: 'design', desc: '手繪風格流程圖線上繪製工具。', icon: 'fa-solid fa-pen-ruler' },
            { id: '5', title: 'Canva', url: 'https://www.canva.com', category: 'design', desc: '線上平面設計與簡報製作平台。', icon: 'fa-solid fa-palette' },
            { id: '6', title: 'JSONLint', url: 'https://jsonlint.com', category: 'utility', desc: '線上 JSON 格式驗證與美化。', icon: 'fa-solid fa-code' },
            { id: '7', title: 'TinyPNG', url: 'https://tinypng.com', category: 'utility', desc: '高效能圖片無損壓縮工具。', icon: 'fa-solid fa-file-image' },
            { id: '8', title: 'Notion', url: 'https://www.notion.so', category: 'doc', desc: '筆記、專案管理與知識庫平台。', icon: 'fa-solid fa-note-sticky' }
        ];

        // Categories Definition
        const categories = [
            { id: 'all', name: '全部', icon: 'fa-solid fa-border-all' },
            { id: 'fav', name: '收藏', icon: 'fa-solid fa-star' },
            { id: 'dev', name: '💻 開發', icon: '' },
            { id: 'ai', name: '🤖 AI 助手', icon: '' },
            { id: 'design', name: '🎨 設計', icon: '' },
            { id: 'utility', name: '⚙️ 小工具', icon: '' },
            { id: 'doc', name: '📝 筆記', icon: '' }
        ];

        // State Management
        let tools = JSON.parse(localStorage.getItem('tb_tools')) || defaultTools;
        let favorites = JSON.parse(localStorage.getItem('tb_favorites')) || ['1', '2'];
        let activeCategory = 'all';
        let searchQuery = '';

        // DOM Elements
        const toolsGrid = document.getElementById('toolsGrid');
        const emptyState = document.getElementById('emptyState');
        const categoryNav = document.getElementById('categoryNav');
        const currentCategoryTitle = document.getElementById('currentCategoryTitle');
        const toolCountBadge = document.getElementById('toolCountBadge');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');

        // Theme Setup
        function initTheme() {
            const isDark = localStorage.getItem('tb_theme') === 'dark' || 
                (!('tb_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('tb_theme', isDark ? 'dark' : 'light');
        });

        // Save Data Helper
        function saveData() {
            localStorage.setItem('tb_tools', JSON.stringify(tools));
            localStorage.setItem('tb_favorites', JSON.stringify(favorites));
        }

        // Show Toast Message
        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = message;
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2000);
        }

        // Toggle Favorite Status
        function toggleFavorite(id, event) {
            event.preventDefault();
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast('已從收藏移除');
            } else {
                favorites.push(id);
                showToast('已加入收藏');
            }
            saveData();
            renderTools();
            renderCategoryNav();
        }

        // Render Horizontal Category Navigation Bar
        function renderCategoryNav() {
            categoryNav.innerHTML = categories.map(cat => {
                const isActive = activeCategory === cat.id;
                let count = 0;
                if (cat.id === 'all') count = tools.length;
                else if (cat.id === 'fav') count = favorites.length;
                else count = tools.filter(t => t.category === cat.id).length;

                return `
                    <button onclick="selectCategory('${cat.id}')" class="px-3 py-1.5 text-xs font-medium rounded-xl whitespace-nowrap transition-all flex items-center space-x-1.5 ${
                        isActive 
                        ? 'bg-purple-500 text-white font-semibold shadow-sm' 
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/60 border border-slate-200/70 dark:border-slate-700/50'
                    }">
                        ${cat.icon ? `<i class="${cat.icon} text-[11px] ${cat.id === 'fav' && !isActive ? 'text-amber-400' : ''}"></i>` : ''}
                        <span>${cat.name}</span>
                        <span class="text-[10px] opacity-75">(${count})</span>
                    </button>
                `;
            }).join('');
        }

        // Select Category
        function selectCategory(catId) {
            activeCategory = catId;
            const categoryObj = categories.find(c => c.id === catId);
            currentCategoryTitle.textContent = categoryObj ? categoryObj.name : '工具列表';
            renderCategoryNav();
            renderTools();
        }

        // Render Tool Cards Grid
        function renderTools() {
            const filtered = tools.filter(tool => {
                const matchesCategory = 
                    activeCategory === 'all' ? true :
                    activeCategory === 'fav' ? favorites.includes(tool.id) :
                    tool.category === activeCategory;

                const query = searchQuery.toLowerCase().trim();
                const matchesSearch = query === '' || 
                    tool.title.toLowerCase().includes(query) ||
                    tool.desc.toLowerCase().includes(query);

                return matchesCategory && matchesSearch;
            });

            toolCountBadge.textContent = `${filtered.length} 個工具`;

            if (filtered.length === 0) {
                toolsGrid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
                toolsGrid.classList.remove('hidden');

                toolsGrid.innerHTML = filtered.map(tool => {
                    const isFav = favorites.includes(tool.id);
                    return `
                        <a href="${tool.url}" target="_blank" rel="noopener noreferrer" 
                           class="group bg-white dark:bg-slate-900 rounded-xl p-3.5 border border-slate-200/80 dark:border-slate-800 hover:border-purple-300 dark:hover:border-purple-500/40 hover:shadow-md transition-all flex items-start justify-between gap-3">
                            <div class="flex items-start space-x-3 min-w-0 flex-1">
                                <div class="w-8 h-8 rounded-lg bg-purple-50 dark:bg-purple-950/40 text-purple-500 dark:text-purple-300 flex items-center justify-center flex-shrink-0 text-sm group-hover:scale-105 transition-transform">
                                    <i class="${tool.icon || 'fa-solid fa-link'}"></i>
                                </div>
                                <div class="min-w-0 flex-1">
                                    <h4 class="font-bold text-xs text-slate-900 dark:text-white truncate group-hover:text-purple-500 dark:group-hover:text-purple-300 transition-colors">
                                        ${tool.title}
                                    </h4>
                                    <p class="text-[11px] text-slate-500 dark:text-slate-400 line-clamp-1 mt-0.5 leading-normal">
                                        ${tool.desc || '開啟網站'}
                                    </p>
                                </div>
                            </div>

                            <button onclick="toggleFavorite('${tool.id}', event)" title="${isFav ? '取消收藏' : '加入收藏'}" class="text-slate-300 dark:text-slate-700 hover:text-amber-400 dark:hover:text-amber-400 p-1 transition-colors flex-shrink-0">
                                <i class="fa-solid fa-star text-xs ${isFav ? 'text-amber-400' : ''}"></i>
                            </button>
                        </a>
                    `;
                }).join('');
            }
        }

        // Handle Search Inputs
        function handleSearch(e) {
            searchQuery = e.target.value;
            if (searchQuery) clearSearchBtn.classList.remove('hidden');
            else clearSearchBtn.classList.add('hidden');
            renderTools();
        }

        function clearSearch() {
            searchQuery = '';
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderTools();
        }

        searchInput.addEventListener('input', handleSearch);

        // Add Tool Modal Handlers
        const addModal = document.getElementById('addModal');
        const modalContainer = document.getElementById('modalContainer');

        function openAddModal() {
            addModal.classList.remove('hidden');
            setTimeout(() => {
                addModal.classList.remove('opacity-0');
                modalContainer.classList.remove('scale-95');
                modalContainer.classList.add('scale-100');
            }, 10);
        }

        function closeAddModal() {
            addModal.classList.add('opacity-0');
            modalContainer.classList.remove('scale-100');
            modalContainer.classList.add('scale-95');
            setTimeout(() => {
                addModal.classList.add('hidden');
                document.getElementById('addToolForm').reset();
            }, 200);
        }

        function getCategoryIcon(cat) {
            switch(cat) {
                case 'dev': return 'fa-solid fa-code';
                case 'ai': return 'fa-solid fa-robot';
                case 'design': return 'fa-solid fa-palette';
                case 'utility': return 'fa-solid fa-wrench';
                case 'doc': return 'fa-solid fa-file-lines';
                default: return 'fa-solid fa-bookmark';
            }
        }

        function handleAddTool(e) {
            e.preventDefault();
            const title = document.getElementById('toolTitle').value.trim();
            const url = document.getElementById('toolUrl').value.trim();
            const category = document.getElementById('toolCategory').value;
            const desc = document.getElementById('toolDesc').value.trim();

            const newTool = {
                id: Date.now().toString(),
                title,
                url,
                category,
                desc,
                icon: getCategoryIcon(category)
            };

            tools.unshift(newTool);
            saveData();
            renderCategoryNav();
            renderTools();
            closeAddModal();
            showToast('已新增工具！');
        }

        // Export Data
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tools, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "toolbox_config.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('已導出 JSON 檔');
        }

        // Reset to Defaults
        function resetDefaults() {
            tools = [...defaultTools];
            favorites = ['1', '2'];
            saveData();
            renderCategoryNav();
            renderTools();
            showToast('已重置為預設工具');
        }

        // Initial Initialization
        window.onload = function() {
            initTheme();
            renderCategoryNav();
            renderTools();
        };
    </script>
</body>
</html>
